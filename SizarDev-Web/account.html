<body>
  <div id="site-header-mount"></div>

  <main id="main-content" class="container auth-section">
    <section class="surface-card auth-card" aria-labelledby="auth-heading">
      <div>
        <span class="eyebrow" data-i18n="authEyebrow">Sizar ID</span>
        <h1 class="headline-md" id="auth-heading" data-i18n="authTitle">Sign in or create account</h1>
        <p class="body-prose" style="font-size: var(--text-sm); margin-block-start: var(--space-2); margin-inline: auto;" data-i18n="authSub">
          Track repair tickets, warranty serials, and saved orders in one place.
        </p>
      </div>

      <!-- Official Apple & Google Sign-in Buttons -->
      <div class="oauth-stack">
        <button type="button" class="btn btn-block btn-oauth-apple" data-oauth-btn="apple">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
          </svg>
          <span data-i18n="authApple">Continue with Apple</span>
        </button>

        <button type="button" class="btn btn-block btn-oauth-google" data-oauth-btn="google">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 11.1h-9.17v2.73h6.51c-.33 1.81-1.5 3.34-3.2 4.37v3.62h5.18c3.03-2.79 4.78-6.9 4.78-11.72 0-.8-.08-1.57-.22-2.3z"/>
            <path fill="#34A853" d="M12.18 22c4.32 0 7.95-1.43 10.6-3.88l-5.18-3.62c-1.43.96-3.26 1.53-5.42 1.53-4.17 0-7.7-2.81-8.96-6.6H-2.1v3.73C.54 18.4 5.94 22 12.18 22z" transform="translate(2 0)"/>
            <path fill="#FBBC05" d="M3.22 13.43a9.55 9.55 0 0 1 0-6.06V3.64H-1.9a15.98 15.98 0 0 0 0 13.52l5.12-3.73z" transform="translate(2 0)"/>
            <path fill="#EA4335" d="M12.18 4.77c2.35 0 4.46.81 6.12 2.4l4.59-4.59C20.12.98 16.5 0 12.18 0 5.94 0 .54 3.6-2.1 8.84l5.12 3.73c1.26-3.79 4.79-6.6 8.96-6.6z" transform="translate(2 0)"/>
          </svg>
          <span data-i18n="authGoogle">Continue with Google</span>
        </button>
      </div>

      <div class="auth-divider">
        <span data-i18n="authDivider">or</span>
      </div>

      <form class="auth-form" id="account-auth-form" novalidate>
        <div class="input-field-wrap">
          <label for="auth-identifier" class="input-label" data-i18n="authInputLabel">Email or phone number</label>
          <input
            type="text"
            id="auth-identifier"
            name="identifier"
            class="text-input"
            autocomplete="username"
            required
            placeholder="name@example.com or +213…"
            data-i18n-placeholder="authInputPlaceholder"
          >
        </div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="authContinueBtn">Continue</button>
      </form>

      <p style="font-size: var(--text-xs); color: var(--text-2);" data-i18n="authFootnote">
        Protected by hardware-key session verification. Prototype mode active.
      </p>
    </section>
  </main>

  <div id="site-footer-mount"></div>

  <script src="data/products.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/nav.js" defer></script>
</body>
</html>
