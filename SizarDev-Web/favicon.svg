<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Titanium Squircle Background -->
    <linearGradient id="bg-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c22"/>
      <stop offset="48%" stop-color="#0d0d11"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <!-- Subtle Apple Blue Ambient Inner Glow -->
    <radialGradient id="ambient-blue" cx="68%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#0071e3" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Specular Metallic Rim Gradient -->
    <linearGradient id="rim-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#2997ff" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0.28"/>
    </linearGradient>
    <!-- Titanium Phone Chassis Gradient -->
    <linearGradient id="phone-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f7"/>
      <stop offset="45%" stop-color="#86868b"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
    <!-- OLED Display Glass Gradient -->
    <linearGradient id="oled-screen" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0a192f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <!-- Starlight 3D Sparkle Gradient -->
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#5ac8fa"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple Continuous-Curvature Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg-titanium)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#ambient-blue)"/>
  <rect x="18" y="18" width="476" height="476" rx="114" fill="none" stroke="url(#rim-light)" stroke-width="4"/>

  <!-- Precision Isometric / Tilted Titanium iPhone Silhouette -->
  <g transform="translate(256, 262) rotate(-8) translate(-256, -262)">
    <!-- Soft Drop Shadow -->
    <rect x="156" y="88" width="200" height="352" rx="44" fill="#000000" opacity="0.65" transform="translate(8, 14)"/>
    <!-- Outer Titanium Frame -->
    <rect x="152" y="82" width="208" height="356" rx="46" fill="#141419" stroke="url(#phone-edge)" stroke-width="7"/>
    <!-- Inner OLED Screen -->
    <rect x="163" y="93" width="186" height="334" rx="36" fill="url(#oled-screen)"/>
    <!-- Subtle Glass Specular Sheen -->
    <path d="M163 129 C163 106, 180 93, 200 93 L305 93 L163 285 Z" fill="#ffffff" opacity="0.07"/>
    <!-- Dynamic Island Pill -->
    <rect x="224" y="108" width="64" height="16" rx="8" fill="#000000"/>
    <circle cx="276" cy="116" r="3.5" fill="#1d3557"/>
    <!-- Stylized "S" / 3D Wave Accent inside Screen -->
    <path d="M214 218 C214 192, 298 192, 298 226 C298 258, 214 262, 214 294 C214 328, 298 328, 298 302" fill="none" stroke="url(#sparkle-grad)" stroke-width="16" stroke-linecap="round" filter="url(#soft-glow)"/>
    <!-- Bottom Home Indicator Bar -->
    <rect x="222" y="409" width="68" height="5" rx="2.5" fill="#ffffff" opacity="0.45"/>
  </g>

  <!-- Apple-Style 4-Point Starlight Sparkle (Top Right) -->
  <g filter="url(#soft-glow)">
    <path d="M382 76 L392 110 L426 120 L392 130 L382 164 L372 130 L338 120 L372 110 Z" fill="url(#sparkle-grad)"/>
    <circle cx="382" cy="120" r="6" fill="#ffffff"/>
  </g>
</svg>